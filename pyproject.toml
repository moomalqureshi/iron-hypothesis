[project]
name = "ironman"
version = "0.1.0"
description = "Ironman training intelligence platform"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "psycopg[binary,pool]>=3.2",
  "redis>=5.0",
  "rq>=1.16",
  "httpx>=0.27",
  "fitparse>=1.2",
  "gpxpy>=1.6",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "cryptography>=43",
  "pyotp>=2.9",
  "itsdangerous>=2.2",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
ml = ["numpy>=1.26", "pandas>=2.2", "scikit-learn>=1.5", "lightgbm>=4.5", "mlflow-skinny>=2.16"]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "fakeredis>=2.23",
    "fit-tool>=0.9.16",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ironman"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["db: needs a running PostgreSQL (TEST_DATABASE_URL)"]
